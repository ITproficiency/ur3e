benchmark_config:
  warehouse:
    host: "/home/tu/.ros/warehouse_ros.sqlite"
    port: 0
    scene_name: "Ur3e"
  parameters:
    name: "Ur3e"
    runs: 10
    group: ur_manipulator
    timeout: 5.0
    output_directory: "/tmp/moveit_benchmarks/"
    query_regex: ".*"     # Chạy toàn bộ các Query bạn đã Save trong Scene này
    # Hoặc ghi rõ tên query cụ thể:
    # query_regex: "pre-grasp"

  planning_pipelines:
    pipelines: [pipeline1]
    pipeline1:
      name: ompl
      planners:
        - RRTConnectkConfigDefault
        - PRMkConfigDefault
        - KPIECEkConfigDefault
        - RRTstarkConfigDefault